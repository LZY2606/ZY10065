server:
  port: 5202

spring:
  datasource:
    url: jdbc:h2:file:./data/gsb
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  jackson:
    serialization:
      write-dates-as-timestamps: false

springdoc:
  api-docs:
    enabled: false
